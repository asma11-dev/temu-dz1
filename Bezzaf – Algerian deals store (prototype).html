<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bezzaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f1f4ee; --ink:#14201a; --muted:#5d6b63; --line:#dfe5dc;
  --green:#0e7a43; --green-ink:#ffffff; --red:#d8262f; --sun:#ffc93c; --sun-ink:#3a2a00; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1713; --surface:#18231d; --ink:#eef3ee; --muted:#9db0a4; --line:#27362d;
    --green:#2fb36d; --green-ink:#06210f; --red:#ff5a62; --card:#141d18;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#18231d; --ink:#eef3ee; --muted:#9db0a4; --line:#27362d;
  --green:#2fb36d; --green-ink:#06210f; --red:#ff5a62; --card:#141d18;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:14px}
.strip{background:var(--green);color:var(--green-ink);font-size:.82rem;font-weight:600;text-align:center;padding:6px 10px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{font-weight:900;font-size:1.7rem;letter-spacing:-.02em;color:var(--green);line-height:1}
.logo i{font-style:normal;color:var(--red)}
.search{flex:1;display:flex;border:2px solid var(--green);border-radius:999px;overflow:hidden;background:var(--card);min-width:0}
.search input{flex:1;border:0;background:transparent;padding:8px 14px;min-width:0;outline:none}
.search button{border:0;background:var(--green);color:var(--green-ink);padding:0 16px;font-weight:800}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 10px;font-weight:700;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cartbtn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;white-space:nowrap}
.cartbtn b{position:absolute;top:-6px;inset-inline-end:-4px;background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18)}}
@media(max-width:640px){.bar{flex-wrap:wrap}.search{order:5;flex-basis:100%}}

.hero{margin-top:14px;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.flash{background:var(--red);color:#fff;border-radius:18px;padding:22px 22px 18px;position:relative;overflow:hidden}
.flash h1{margin:0 0 4px;font-size:clamp(1.7rem,5vw,2.7rem);font-weight:900;line-height:1.05}
.flash p{margin:0 0 14px;opacity:.95;max-width:34ch}
.timer{display:inline-flex;gap:6px;direction:ltr}
.timer span{background:rgba(0,0,0,.28);border-radius:8px;padding:4px 9px;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.15rem}
.flash .big{position:absolute;inset-inline-end:-10px;bottom:-26px;font-size:9rem;opacity:.18;transform:rotate(-12deg);pointer-events:none}
.perks{display:grid;gap:10px}
.perk{background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.perk .ic{font-size:1.6rem}
.perk strong{display:block;line-height:1.2}
.perk small{color:var(--muted)}
.spincta{border:0;text-align:start;background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-weight:800}
.spincta .ic{font-size:1.8rem;animation:wob 2.4s infinite}
@keyframes wob{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-14deg)}90%{transform:rotate(14deg)}}
.spincta small{display:block;font-weight:600}

.free{margin-top:12px;background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.track{flex:1;min-width:120px;height:8px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--sun-ink);border-radius:99px;transition:width .35s}
.admin{margin-top:12px;background:var(--surface);border:2px dashed var(--green);border-radius:12px;padding:10px 14px;font-weight:600;display:none}
.admin.on{display:block}

.tools{display:flex;gap:10px;align-items:center;padding-top:14px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700}
.cat[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.sort{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-weight:600;max-width:160px}
h2{font-size:1.25rem;margin:16px 0 10px;font-weight:900}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .18s,box-shadow .18s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.12)}}
.pic{display:block;width:100%;border:0;padding:0;aspect-ratio:1/1;position:relative;overflow:hidden}
.pic .em{position:absolute;inset:0;display:grid;place-items:center;font-size:4.2rem}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--red);color:#fff;font-weight:800;font-size:.78rem;border-radius:6px;padding:1px 7px;z-index:2}
.heart{position:absolute;top:6px;inset-inline-end:6px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:1.1rem;color:#888;display:grid;place-items:center}
.heart[aria-pressed="true"]{color:var(--red)}
.heart.pop{animation:bump .4s}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:.92rem;line-height:1.3;min-height:2.6em;background:none;border:0;padding:0;text-align:start}
.stock{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}
.stock i{display:block;height:100%;background:var(--red);border-radius:99px}
.sold{font-size:.76rem;color:var(--muted)}
.sold.hot{color:var(--red);font-weight:700}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.price b{font-size:1.25rem;font-weight:900;color:var(--red)}
.price s{font-size:.8rem;color:var(--muted)}
.add{margin-top:6px;border:0;border-radius:999px;background:var(--green);color:var(--green-ink);font-weight:800;padding:8px 10px}
.add:active{transform:scale(.97)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-weight:900}
.x{border:0;background:var(--surface);border-radius:50%;width:34px;height:34px;font-size:1.1rem;flex:none}
.db{flex:1;overflow:auto;padding:12px 16px}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .t{width:56px;height:56px;border-radius:10px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;font-size:2rem}
.line .t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.line .m{flex:1;min-width:0}
.line .m .n{font-weight:600;font-size:.9rem;line-height:1.25}
.line .m small{color:var(--muted);display:block}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800}
.df{border-top:1px solid var(--line);padding:12px 16px 16px;background:var(--surface)}
.row{display:flex;justify-content:space-between;margin:2px 0}
.row.tot{font-weight:900;font-size:1.15rem;margin-top:6px}
.row.disc{color:var(--green);font-weight:700}
.cta{width:100%;margin-top:10px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900;padding:12px;font-size:1.05rem}
.f{display:grid;gap:10px}
.f label{font-weight:700;font-size:.88rem;display:grid;gap:4px}
.f input,.f select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.pay{display:grid;gap:8px}
.pay div{border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.pay div.ok{border-color:var(--green);background:var(--surface);font-weight:700}
.pay small{color:var(--muted);display:block;font-weight:400}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:3.5rem}
.link{background:none;border:0;color:var(--green);font-weight:800;padding:0;text-decoration:underline}

.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.55)}
.modal.on{display:flex}
.sheet{background:var(--bg);border-radius:18px;width:min(860px,100%);max-height:calc(100% - 10px);overflow:auto;position:relative;padding:16px;animation:rise .22s}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.sheet>.x{position:absolute;top:10px;inset-inline-end:10px;z-index:3}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}}
.main{aspect-ratio:1/1;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;font-size:8rem}
.main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.main .nop{position:absolute;bottom:8px;inset-inline:8px;text-align:center;font-size:.78rem;font-weight:600;background:rgba(255,255,255,.85);color:#333;border-radius:8px;padding:2px 6px}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:56px;height:56px;border-radius:8px;border:2px solid var(--line);padding:0;overflow:hidden;position:relative;background:var(--surface)}
.thumbs button[aria-current="true"]{border-color:var(--green)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd h3{margin:0 0 6px;font-size:1.3rem;font-weight:900;line-height:1.25;padding-inline-end:40px}
.pd .price b{font-size:1.9rem}
.pd .price s{font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--surface)}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.lbl{font-weight:800;font-size:.88rem;margin-top:10px}
.live{font-size:.82rem;color:var(--red);font-weight:700;margin:4px 0}
.up{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px;border:2px dashed var(--green);border-radius:12px;font-size:.88rem;font-weight:600}
.up label{background:var(--green);color:var(--green-ink);border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
.up button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700}
.favbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:800;font-size:1.05rem}
.favbtn[aria-pressed="true"]{color:var(--red);border-color:var(--red)}
.buyrow{display:flex;gap:8px;margin-top:14px}
.buyrow .cta{margin:0;flex:1}

/* wheel */
.wheel{text-align:center}
.wheel h3{margin:0 0 4px;font-size:1.5rem;font-weight:900}
.wheel p{margin:0 0 10px;color:var(--muted)}
.wbox{position:relative;width:min(320px,80vw);margin:0 auto 12px}
.wbox svg{width:100%;height:auto;display:block}
.wbox .pt{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:2rem;color:var(--ink);z-index:2;line-height:1}
#wg{transition:transform 4s cubic-bezier(.17,.67,.12,1);transform-origin:0 0}
.won{font-size:1.4rem;font-weight:900;color:var(--green);margin:6px 0}

#toasts{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:60;pointer-events:none;padding-inline:12px}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 16px;font-weight:700;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:rise .25s;max-width:min(92vw,420px)}
.toast.soft{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
footer{background:var(--surface);padding:22px 0 30px;color:var(--muted);font-size:.85rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== buttons ===== */
.btn,.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;min-height:46px;font-weight:800;line-height:1.1;position:relative;transition:transform .12s,box-shadow .18s,filter .18s}
.btn-primary{background:var(--green);color:var(--green-ink)}
.btn-hot,.cta{background:linear-gradient(135deg,#ff6a3c,var(--red));color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
@media(hover:hover){.btn:hover,.cta:hover{filter:brightness(1.07);box-shadow:0 6px 16px rgba(0,0,0,.2);transform:translateY(-1px)}}
.btn:active,.cta:active{transform:scale(.97)}
.btn[disabled],.cta[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn.busy,.cta.busy{color:transparent!important;pointer-events:none}
.btn.busy::after,.cta.busy::after{content:"";position:absolute;width:20px;height:20px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cta{width:100%}
.add{width:100%;margin-top:6px;padding:8px 10px;min-height:42px;border-radius:999px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-top:6px;border-radius:999px;background:var(--surface);padding:3px;min-height:42px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--green);color:var(--green-ink);font-size:1.25rem;font-weight:900;transition:transform .1s}
.stepper button:active{transform:scale(.88)}
.stepper span{font-weight:900}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;white-space:nowrap;transition:transform .12s}
.iconbtn:active{transform:scale(.94)}
.who{display:none}
@media(min-width:900px){.who{display:inline}}
.chip{min-height:40px;transition:transform .1s,border-color .15s}
.chip:active{transform:scale(.94)}
.search button{transition:filter .15s}
.search button:hover{filter:brightness(1.1)}
.buyrow{position:sticky;bottom:-16px;background:var(--bg);padding:10px 0 4px;flex-wrap:wrap;z-index:2}
.buyrow .btn{flex:1;min-width:150px}
.favbtn{min-height:46px;min-width:50px;transition:transform .12s}
.favbtn:active{transform:scale(.92)}
.admin.on{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.arow{display:flex;gap:8px;flex-wrap:wrap}
.arow .btn{min-height:40px;padding:6px 14px}
.narrow{width:min(540px,100%)}
.acc h3{margin:0 0 4px;font-weight:900;font-size:1.3rem;padding-inline-end:40px}
.acc .muted{color:var(--muted);margin:0 0 12px}
.acc h4{margin:20px 0 6px;font-weight:900}
.acc .f .btn{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.marg{align-self:end;font-size:.82rem;font-weight:700;padding-bottom:10px}
.ord{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.chk{display:flex!important;grid-template-columns:none!important;align-items:center;gap:8px;font-weight:600!important}
.chk input{width:18px;height:18px;padding:0}
.dangerbtn{margin-top:12px}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<header>
  <div class="wrap bar">
    <div class="logo" aria-label="Bezzaf">Bezza<i>f</i></div>
    <form class="search" role="search" onsubmit="return false">
      <input id="q" type="search" autocomplete="off"><button id="qb" type="button"></button>
    </form>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="fr" aria-pressed="true">FR</button>
      <button data-l="ar" aria-pressed="false">عربية</button>
      <button data-l="en" aria-pressed="false">EN</button>
    </div>
    <button class="iconbtn" id="openAcc" aria-label="Account">👤</button>
    <button class="cartbtn" id="openCart"><span id="cartLbl"></span><b id="cartN">0</b></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="flash">
      <h1 id="heroT"></h1><p id="heroP"></p>
      <div class="timer"><span id="th">00</span><span id="tm">00</span><span id="ts">00</span></div>
      <div class="big" aria-hidden="true">🔥</div>
    </div>
    <div class="perks" id="perks"></div>
  </section>
  <div class="free" id="free"><span id="freeTxt"></span><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="admin" id="admin"></div>
  <div class="tools">
    <div class="cats" id="cats" role="group"></div>
    <select class="sort" id="sort" aria-label="Sort"></select>
  </div>
  <h2 id="gridT"></h2>
  <div class="grid" id="grid"></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="dh"><h3 id="dTitle"></h3><button class="x" id="closeCart" aria-label="Close">✕</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
const FREE_FROM = 5000;
const WILAYAS = {"Alger":400,"Blida":500,"Boumerdès":500,"Tipaza":500,"Tizi Ouzou":550,"Béjaïa":600,"Oran":600,"Constantine":600,"Annaba":650,"Sétif":600,"Batna":650,"Tlemcen":650,"Sidi Bel Abbès":650,"Biskra":700,"Chlef":600,"Médéa":550,"Djelfa":700,"Mostaganem":600,"Ouargla":900,"Ghardaïa":900,"Béchar":1100,"Tamanrasset":1400,"Adrar":1300};
const COLORS = {
  black:{h:"#222",fr:"Noir",ar:"أسود",en:"Black"}, white:{h:"#f4f4f4",fr:"Blanc",ar:"أبيض",en:"White"},
  green:{h:"#2e9e5b",fr:"Vert",ar:"أخضر",en:"Green"}, blue:{h:"#2f6fdb",fr:"Bleu",ar:"أزرق",en:"Blue"},
  pink:{h:"#f08ab1",fr:"Rose",ar:"وردي",en:"Pink"}, red:{h:"#d8262f",fr:"Rouge",ar:"أحمر",en:"Red"}
};
const CATS = [

/* ---------- toasts & animations ---------- */
function toast(msg,soft){ const d=document.createElement("div"); d.className="toast"+(soft?" soft":""); d.textContent=msg; $("toasts").appendChild(d); setTimeout(()=>d.remove(),soft?4200:2000); }
function bump(){ const b=$("openCart"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
function fly(from,emoji){
  const rm=matchMedia("(prefers-reduced-motion: reduce)").matches; if(rm||!from.getBoundingClientRect){bump();return}
  const a=from.getBoundingClientRect(), b=$("openCart").getBoundingClientRect(), d=document.createElement("div");
  d.textContent=emoji; d.setAttribute("aria-hidden","true");
  d.style.cssText=`position:fixed;left:${a.left+a.width/2-16}px;top:${a.top}px;font-size:2rem;z-index:70;pointer-events:none`;
  document.body.appendChild(d);
  d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.3)`,opacity:.3}],{duration:650,easing:"cubic-bezier(.4,0,.8,.4)"}).onfinish=()=>{d.remove();bump()};
}
function afterCart(){ save(); renderFree(); renderGrid(); if($("drawer").classList.contains("on")) renderDrawer(); }
function addToCart(id,v,q,from){
  const k=id+"|"+(v||""); cart[k]=(cart[k]||0)+q; afterCart();

}

function polar(r,a){const x=r*Math.sin(a*Math.PI/180),y=-r*Math.cos(a*Math.PI/180);return x.toFixed(2)+" "+y.toFixed(2)}
function renderWheel(){
  const t=L(), cols=["#0e7a43","#ffc93c","#d8262f"], txt=["#fff","#3a2a00","#fff"];
  const segs=PRIZES.map((z,i)=>{const a0=i*60,a1=a0+60,mid=a0+30;
    return `<path d="M0 0 L${polar(96,a0)} A96 96 0 0 1 ${polar(96,a1)} Z" fill="${cols[i%3]}" stroke="#fff" stroke-width="2"/>
    <text transform="rotate(${mid}) translate(0 -62)" text-anchor="middle" dominant-baseline="middle" font-weight="900" font-size="17" fill="${txt[i%3]}">${z.t}</text>`}).join("");
  const done=coupon&&coupon.day===today();
  $("sheet").innerHTML=`<button class="x" data-act="close" aria-label="Close">✕</button><div class="wheel"><h3>🎁 ${t.wT}</h3><p>${t.wP}</p>
   <div class="wbox"><span class="pt" aria-hidden="true">▼</span><svg viewBox="-100 -100 200 200" role="img" aria-label="${t.wT}"><g id="wg" style="transform:rotate(${modal.rot||0}deg)">${segs}</g><circle r="10" fill="#fff" stroke="#14201a" stroke-width="3"/></svg></div>
   <div id="wres">${done?`<div class="won">${t.wWon} ${couponText(coupon)}</div><p>${t.wDone}</p>`:""}</div>
   ${done?`<button class="cta" data-act="close" style="background:var(--green);color:var(--green-ink)">${t.wUse}</button>`:`<button class="cta" id="spinGo" data-act="spinGo">${t.wGo}</button>`}</div>`;

function spin(){

function shrink(file){
  return createImageBitmap(file).then(bm=>{ const s=Math.min(1,1100/Math.max(bm.width,bm.height)), c=document.createElement("canvas"); c.width=Math.round(bm.width*s); c.height=Math.round(bm.height*s);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height); return new Promise(r=>c.toBlob(r,"image/jpeg",.86)); });
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-quick],[data-open],[data-fav],[data-inc],[data-dec],[data-c],[data-l],[data-act],[data-optv],[data-img],[data-mq],[data-apc]");
  if(el){
    const d=el.dataset;
    if(d.quick){ const p=prod(d.quick); if(p.opt) openModal({id:p.id,v:p.opt.v[0],q:1,img:0}); else addToCart(p.id,"",1,el); }
    else if(d.open){ const p=prod(d.open); openModal({id:p.id,v:p.opt?p.opt.v[0]:"",q:1,img:0}); }
    else if(d.fav){ const id=String(d.fav), i=wish.indexOf(id); if(i<0){wish.push(id);toast(L().saved)}else{wish.splice(i,1);toast(L().unsaved)} save(); renderStatic(); renderGrid(); if(modal&&!modal.type) renderModal(); }
    else if(d.inc){ if(cart[d.inc]!=null){cart[d.inc]++; afterCart();} }
    else if(d.dec){ if(cart[d.dec]!=null){ if(--cart[d.dec]<=0) delete cart[d.dec]; afterCart(); } }
    else if(d.c){ cat=d.c; renderStatic(); renderGrid(); }
    else if(d.l){ lang=d.l; ls.set("bz_lang",lang); renderStatic(); renderGrid(); renderFree(); accBadge(); if($("drawer").classList.contains("on")) renderDrawer(); if(modal) renderModal(); }
    else if(d.optv){ modal.v=d.optv; renderModal(); }
    else if(d.img){ modal.img=+d.img; renderModal(); }
    else if(d.mq){ modal.q=Math.max(1,Math.min(10,modal.q+ +d.mq)); renderModal(); }
    else if(d.apc){ el.setAttribute("aria-pressed",el.getAttribute("aria-pressed")!=="true"); }
    else if(d.act==="spin"){ openModal({type:"wheel",rot:0}); }
    else if(d.act==="spinGo"){ spin(); }
    else if(d.act==="close"){ closeModal(); }
    else if(d.act==="delphoto"){ delPhoto(); }
    else if(d.act==="addp"){ openModal({type:"addp"}); }
    else if(d.act==="delprod"){ if(!modal.cd){ modal.cd=true; renderModal(); } else delProduct(); }
    else if(d.act==="togdemo"){ if(db) db.doc("settings/store").set({hideDemo:!hideDemo}).catch(()=>toast(L().upErr)); }
    return;
  }
  const bt=e.target.closest("button"), id=bt?bt.id:"";
  if(id==="mAdd"){ const p=prod(modal.id); addToCart(p.id,modal.v||"",modal.q,bt); closeModal(); }
  if(id==="mBuy"){ const p=prod(modal.id); addToCart(p.id,modal.v||"",modal.q,bt); closeModal(); openDrawer("checkout"); }
  if(id==="toCheckout"){ view="checkout"; renderDrawer(); }
  if(id==="backCart"){ view="cart"; renderDrawer(); }
  if(id==="keep"){ closeDrawer(); }
  if(id==="place"){
    const n=$("fName").value.trim(), ph=$("fPhone").value.trim(), w=$("fWil").value, ad=$("fAddr").value.trim();
    if(!n||!/^0[567]\d{8}$/.test(ph)||!w||!ad){ $("err").textContent=L().err; return; }
    if($("fSave").checked) ls.set("bz_profile",{name:n,phone:ph,wil:w,addr:ad});
    bt.classList.add("busy"); bt.disabled=true;
    const sub=subtotal(), total=sub-discount(sub)+shipFee(w), items=count();
    /* TODO: send the order to a real backend (Google Sheet / WhatsApp / database) */
    setTimeout(()=>{
      lastFee=String(10000+Math.floor(Math.random()*89999));
      const od=ls.get("bz_orders",[])||[]; od.unshift({no:lastFee,ts:Date.now(),total,n:items,wil:w}); ls.set("bz_orders",od.slice(0,20));
      cart={}; coupon=null; ls.set("bz_coupon",null); save(); view="done"; renderDrawer(); renderFree(); renderGrid(); accBadge();
    },700);
  }
  if(e.target===$("modal")) closeModal();
});
document.addEventListener("change",e=>{
  if(e.target.id==="sort"){ sort=e.target.value; renderGrid(); }
  if(e.target.id==="fileIn"&&e.target.files.length) uploadPhotos(Array.from(e.target.files));
});
document.addEventListener("input",e=>{ if(e.target.id==="apP"||e.target.id==="apB") updMarg(); });
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="accForm"){
    const pr={name:$("aName").value.trim(),phone:$("aPhone").value.trim(),wil:$("aWil").value,addr:$("aAddr").value.trim()}, m=$("aMsg");
    if(pr.phone&&!/^0[567]\d{8}$/.test(pr.phone)){ m.textContent=L().accBad; m.style.color="var(--red)"; return; }
    ls.set("bz_profile",pr); m.textContent=L().accSaved; m.style.color="var(--green)"; accBadge();
  }
  if(e.target.id==="apForm") saveProduct();
});
$("openCart").onclick=()=>openDrawer("cart");
$("openAcc").onclick=()=>openModal({type:"account"});
$("closeCart").onclick=closeDrawer; $("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){closeDrawer();closeModal();} });
$("q").addEventListener("input",e=>{query=e.target.value;renderGrid()});
$("qb").onclick=()=>renderGrid();

/* countdown */
function tick(){ const n=new Date(), end=new Date(n); end.setHours(24,0,0,0); let s=Math.floor((end-n)/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60; const p=x=>String(x).padStart(2,"0"); $("th").textContent=p(h);$("tm").textContent=p(m);$("ts").textContent=p(s); }
tick(); setInterval(tick,1000);

/* demo purchase notifications (simulated — remove or wire to real orders) */
function recent(){
  if(P.length&&!modal&&!$("drawer").classList.contains("on")){
    const p=P[Math.floor(Math.random()*P.length)], w=Object.keys(WILAYAS)[Math.floor(Math.random()*12)], n=NAMES[Math.floor(Math.random()*NAMES.length)];
    toast(L().recent(n,w,nmr(p)),true);
  }
  setTimeout(recent,16000+Math.random()*12000);
}
setTimeout(recent,9000);

/* ---------- boot ---------- */
renderStatic(); renderGrid(); renderFree(); accBadge();
(async()=>{
  try{
    if(!window.claude||!claude.use) return;
    db=await claude.use("db"); assets=await claude.use("assets");
    if(db){
      db.collection("photos").onSnapshot(sn=>{ photos={}; sn.docs.forEach(d=>{const x=d.data(); if(x&&Array.isArray(x.ids)) photos[d.id]=x.ids.filter(v=>typeof v==="string"&&/^[0-9a-f]{32}$/.test(v))}); renderGrid(); renderFree(); if(modal&&!modal.type) renderModal(); if($("drawer").classList.contains("on")) renderDrawer(); },()=>{});
      db.collection("products").onSnapshot(sn=>{ custom=sn.docs.map(d=>cleanProd(d.id,d.data())).filter(Boolean).sort((a,b)=>b.created-a.created); rebuild(); renderGrid(); if(modal&&!modal.type){ if(prod(modal.id)) renderModal(); else closeModal(); } if($("drawer").classList.contains("on")) renderDrawer(); },()=>{});
      db.doc("settings/store").onSnapshot(sn=>{ const x=sn.exists?sn.data():null; hideDemo=!!(x&&x.hideDemo); rebuild(); renderAdmin(); renderGrid(); },()=>{});
    }
    renderAdmin();
  }catch(e){}
})();
</script>
